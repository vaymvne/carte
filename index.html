<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mohamed Aymane Jahel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: sober, confident, an engineer's calling card
   IDEA: a solar panel's cell grid as the card's top band
   PICTURE: PV cell grid with the portrait set into it
   COLOUR and TYPE: white ground, graphite ink, electric blue lead, copper accent; Archivo + Inter
   LAYOUT: one phone-width column: identity, contact buttons, CVs, highlights */
:root{color-scheme:light dark;--bg:light-dark(#f3f5f8,#0e1318);--card:light-dark(#ffffff,#161d24);--ink:light-dark(#141c24,#e9eef3);--mute:light-dark(#5a6673,#9aa7b4);--line:light-dark(#e2e7ee,#26313c);--blue:light-dark(#1d55c9,#6d9cff);--cu:light-dark(#b8611f,#e08a4a);--cell:light-dark(#1c3f8f,#183466)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 12px 40px rgba(10,20,40,.08)}
.panel{position:relative;height:150px;background:var(--cell)}
.panel svg{position:absolute;inset:0;width:100%;height:100%}
.ph{position:absolute;left:50%;bottom:-56px;transform:translateX(-50%);width:116px;height:116px;border-radius:50%;border:5px solid var(--card);background:var(--card) center/cover no-repeat;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.id{text-align:center;padding:66px 20px 6px}
h1{font:800 30px/1.05 Archivo,sans-serif;margin:0 0 8px;text-wrap:balance}
.role{font-weight:600;color:var(--blue);margin:0}
.sub{color:var(--mute);font-size:15px;margin:6px 0 0}
.lang{display:flex;justify-content:center;gap:6px;margin:14px 0 4px}
.lang button{font:600 13px Inter,sans-serif;min-height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--mute);cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.sec{padding:18px 20px;border-top:1px solid var(--line)}
h2{font:700 17px/1.2 Archivo,sans-serif;margin:0 0 12px}
.btns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
a.b,button.b{display:flex;align-items:center;gap:10px;min-height:52px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--ink);text-decoration:none;font:600 15px Inter,sans-serif;cursor:pointer;text-align:start}
a.b:focus-visible,button.b:focus-visible,.lang button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.b svg{flex:none;width:22px;height:22px}
.b.wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff}
.b.li{background:var(--blue);border-color:var(--blue);color:#fff}
.b small{display:block;font-weight:500;color:var(--mute);font-size:13px}
.full{grid-column:1/-1}
.cv a.b{justify-content:space-between}
.cv .flag{font:700 13px Archivo,sans-serif;color:var(--cu);letter-spacing:.02em}
ul.hl{list-style:none;margin:0;padding:0;display:grid;gap:10px}
ul.hl li{display:grid;grid-template-columns:112px minmax(0,1fr);gap:12px;align-items:baseline}
.k{font:800 18px/1.1 Archivo,sans-serif;color:var(--cu);white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags span{font-size:14px;padding:6px 12px;border-radius:99px;background:light-dark(#eef2fb,#1b2533);color:var(--ink)}
.copyrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.copyrow:last-child{border-bottom:0}
.copyrow span{overflow-wrap:anywhere}
.cp{flex:none;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font:600 13px Inter,sans-serif;cursor:pointer}
.lf{display:grid;gap:10px}.lf label{display:grid;gap:4px;font-size:14px;font-weight:600;color:var(--mute)}
.lf input{font:16px Inter,sans-serif;min-height:46px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink)}
.lf input:focus-visible{outline:3px solid var(--blue);outline-offset:1px}.lf .b{justify-content:center}
.foot{text-align:center;color:var(--mute);font-size:13px;margin-top:16px}
@media(max-width:380px){.btns{grid-template-columns:minmax(0,1fr)}h1{font-size:26px}}
@media(prefers-reduced-motion:no-preference){.card{animation:up .5s ease-out}@keyframes up{from{opacity:0;transform:translateY(10px)}}}
</style></head><body>
